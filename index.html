<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wealth Pie: The $100T Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="intro-screen" class="view">
        <div class="content">
            <h1>Wealth Pie</h1>
            <p>America has <strong>$100 Trillion</strong> in private wealth. How do you think it's divided?</p>
            <div class="pie-preview"></div>
            <button id="start-btn" class="primary-btn">Start Distribution</button>
        </div>
    </section>

<div class="progress-container">
    <div id="p-bar" class="progress-fill"></div>
</div>

<section id="game-screen" class="view hidden">
    <div class="header-space">
        <h2 style="margin: 0;">Distribute $100T</h2>
        <p style="opacity: 0.6; font-size: 0.9rem;">Tap a plate to undo a slice</p>
    </div>

    <div id="reservoir" class="dock">
        <div class="slice-pill" draggable="true" data-value="10">$10T</div>
        <div class="slice-pill" draggable="true" data-value="5">$5T</div>
    </div>

    <div class="game-board" id="board"></div>

    <div class="controls">
        <button id="submitBtn" class="primary-btn" disabled>FINALIZE GUESS</button>
    </div>
</section>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="result-title">Results</h2>
            <p id="result-text"></p>
            <button onclick="location.reload()" class="primary-btn">Play Again</button>
            <button id="shareBtn" class="secondary-btn">Share Score</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
